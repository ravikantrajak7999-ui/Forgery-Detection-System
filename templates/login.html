<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Forensic Portal | Secure Authentication</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: radial-gradient(circle at top, #0d1b2a 0%, #050a12 100%);
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: rgba(16, 28, 46, 0.92);
            border: 1px solid rgba(0, 242, 254, 0.25);
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.12);
            border-radius: 14px;
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
        }
        .brand { text-align: center; margin-bottom: 22px; }
        .brand h2 { color: #00f2fe; font-size: 22px; letter-spacing: 1px; }
        .brand p { color: #8fa3bf; font-size: 13px; margin-top: 4px; }

        .tabs { display: flex; background: #091322; border-radius: 8px; padding: 4px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 9px; border: none; background: transparent; color: #8fa3bf;
            font-weight: 600; cursor: pointer; border-radius: 6px; transition: 0.2s;
        }
        .tab-btn.active { background: #00f2fe; color: #050a12; }

        .alert {
            padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 16px;
            background: rgba(255, 59, 59, 0.15); border: 1px solid #ff3b3b; color: #ff8a8a;
        }
        .alert.success {
            background: rgba(0, 230, 118, 0.15); border-color: #00e676; color: #69f0ae;
        }

        .form-group { margin-bottom: 15px; position: relative; }
        .form-group label { display: block; font-size: 12px; color: #a8b9cf; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid #233854;
            background: #091322; color: #fff; font-size: 14px; outline: none; transition: 0.2s;
        }
        .form-group input:focus { border-color: #00f2fe; }
        .toggle-pass {
            position: absolute; right: 12px; top: 33px; cursor: pointer; font-size: 14px; color: #8fa3bf;
            user-select: none;
        }

        .options-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; color: #8fa3bf; margin-bottom: 18px;
        }
        .options-row a { color: #00f2fe; text-decoration: none; cursor: pointer; }
        .options-row a:hover { text-decoration: underline; }

        .submit-btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .submit-btn:hover { opacity: 0.92; }

        .divider {
            display: flex; align-items: center; text-align: center; color: #6c809a;
            font-size: 12px; margin: 18px 0;
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #233854; }
        .divider:not(:empty)::before { margin-right: 10px; }
        .divider:not(:empty)::after { margin-left: 10px; }

        .google-btn {
            width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #2d4463;
            background: #ffffff; color: #1f2937; font-size: 14px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            text-decoration: none; cursor: pointer; transition: 0.2s;
        }
        .google-btn:hover { background: #f3f4f6; }

        .bio-tag {
            margin-top: 16px; text-align: center; font-size: 11px; color: #00e676;
            font-family: monospace;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="brand">
        <h2>🛡️ FORENSIC AI GUARD</h2>
        <p>Attention-Based Digital Media & Document Verification</p>
    </div>

    {% if error %}
        <div class="alert">{{ error }}</div>
    {% endif %}
    {% if success %}
        <div class="alert success">{{ success }}</div>
    {% endif %}

    <!-- Switch Tabs -->
    <div class="tabs">
        <button type="button" class="tab-btn active" id="tab-login" onclick="switchMode('login')">Sign In</button>
        <button type="button" class="tab-btn" id="tab-register" onclick="switchMode('register')">Create Account</button>
    </div>

    <!-- 1. SIGN IN FORM -->
    <form id="login-form" method="POST" action="/login">
        <input type="hidden" name="action_type" value="login">
        <input type="hidden" name="typing_biometrics" id="typing_biometrics_login" value="90 WPM | Verified">

        <div class="form-group">
            <label>Email or Username</label>
            <input type="text" name="username" id="login_user" placeholder="Enter your email or username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" id="login_pass" placeholder="Enter your password" required>
            <span class="toggle-pass" onclick="togglePass('login_pass')">👁️</span>
        </div>

        <div class="options-row">
            <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                <input type="checkbox" name="remember"> Remember me
            </label>
            <a onclick="switchMode('forgot')">Forgot Password?</a>
        </div>

        <button type="submit" class="submit-btn">Sign In to Forensic Lab</button>
    </form>

    <!-- 2. CREATE ACCOUNT (SIGN UP) FORM -->
    <form id="register-form" class="hidden" method="POST" action="/login">
        <input type="hidden" name="action_type" value="register">
        <input type="hidden" name="typing_biometrics" id="typing_biometrics_reg" value="90 WPM | Verified">

        <div class="form-group">
            <label>Full Name / Username</label>
            <input type="text" name="full_name" placeholder="e.g. Ravikant Rajak" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label>Create Strong Password</label>
            <input type="password" name="password" id="reg_pass" placeholder="Minimum 6 characters" minlength="6" required>
            <span class="toggle-pass" onclick="togglePass('reg_pass')">👁️</span>
        </div>

        <div class="form-group">
            <label>Security Recovery PIN (4-Digit)</label>
            <input type="text" name="recovery_pin" placeholder="e.g. 2026 (for password reset)" maxlength="6" required>
        </div>

        <button type="submit" class="submit-btn">Create Secure Account</button>
    </form>

    <!-- 3. FORGOT PASSWORD FORM -->
    <form id="forgot-form" class="hidden" method="POST" action="/login">
        <input type="hidden" name="action_type" value="forgot">

        <div class="form-group">
            <label>Registered Email Address</label>
            <input type="email" name="email" placeholder="Enter your registered email" required>
        </div>

        <div class="form-group">
            <label>4-Digit Security Recovery PIN</label>
            <input type="text" name="recovery_pin" placeholder="Enter your recovery PIN" required>
        </div>

        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="new_password" id="reset_pass" placeholder="Enter new password" minlength="6" required>
            <span class="toggle-pass" onclick="togglePass('reset_pass')">👁️</span>
        </div>

        <button type="submit" class="submit-btn">Reset Password</button>
        <div style="text-align:center; margin-top:12px;">
            <a style="color:#00f2fe; font-size:13px; cursor:pointer;" onclick="switchMode('login')">← Back to Sign In</a>
        </div>
    </form>

    

    <div class="bio-tag" id="bioStatus">⚡ Keystroke Biometric Sensor: Active</div>
</div>

<script>
    function switchMode(mode) {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('register-form').classList.add('hidden');
        document.getElementById('forgot-form').classList.add('hidden');
        document.getElementById('tab-login').classList.remove('active');
        document.getElementById('tab-register').classList.remove('active');

        if (mode === 'login') {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('tab-login').classList.add('active');
        } else if (mode === 'register') {
            document.getElementById('register-form').classList.remove('hidden');
            document.getElementById('tab-register').classList.add('active');
        } else {
            document.getElementById('forgot-form').classList.remove('hidden');
        }
    }

    function togglePass(inputId) {
        const inp = document.getElementById(inputId);
        inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    // Keystroke Biometrics Sensor (WPM & Flight Time)
    let keyTimes = [];
    document.addEventListener('keydown', () => {
        const now = Date.now();
        keyTimes.push(now);
        if (keyTimes.length > 2) {
            let diffs = [];
            for (let i = 1; i < keyTimes.length; i++) {
                let d = keyTimes[i] - keyTimes[i - 1];
                if (d < 2000) diffs.push(d);
            }
            if (diffs.length > 0) {
                let avgMs = Math.round(diffs.reduce((a, b) => a + b, 0) / diffs.length);
                let wpm = Math.min(160, Math.max(25, Math.round(12000 / Math.max(avgMs, 60))));
                let bioVal = '${avgMs}ms/key (~${wpm} WPM)';
                document.getElementById('typing_biometrics_login').value = bioVal;
                document.getElementById('typing_biometrics_reg').value = bioVal;
                document.getElementById('bioStatus').innerText = '⚡ Live Typing Rhythm: ${bioVal}';
            }
        }
    });
</script>

</body>
</html>
